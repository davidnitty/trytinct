name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tinct (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  # The heavy training stack is exercised on a GPU runner (manual dispatch).
  gpu-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tinct (full)
        run: pip install -e ".[train]"
      - name: Run fail-closed smoke test on CPU
        run: |
          tinct init smoke hf-internal-testing/tiny-random-LlamaForCausalLM
          cd smoke
          cp ../examples/broken_data.jsonl .
          tinct train --dataset broken_data.jsonl --max-loss-threshold 2.0 \
            || [ $? -eq 2 ]   # DON'T SHIP is the expected outcome