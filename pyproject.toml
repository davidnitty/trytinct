[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinct"
version = "0.5.0"
description = "CLI-first post-training stack for LLMs — validate, train, eval, and ship with cryptographic evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tinct" }]
keywords = ["llm", "fine-tuning", "lora", "qlora", "post-training", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
]

# Lightweight core: importing `tinct` must NOT pull in torch/transformers.
# Heavy ML packages live in the optional extras below and are imported lazily
# at runtime only when a command or model family needs them.
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "cryptography>=41.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "transformers>=4.43",
    "trl>=0.8",
    "peft>=0.11",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "datasets>=2.18",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
eval = [
    "scikit-learn>=1.3",
]
# CUDA-only acceleration backend (Triton kernels for Llama/Qwen).
unsloth = [
    "unsloth",
]
# Toxicity scoring (Gate 3 of the behavioral certification).
toxicity = [
    "detoxify>=0.5.0",
]
full = [
    "tinct[train]",
    "tinct[eval]",
]
all = [
    "tinct[train]",
    "tinct[eval]",
    "tinct[unsloth]",
    "tinct[toxicity]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tinct = "tinct.cli.app:main"

[project.urls]
Homepage = "https://github.com/davidnitty/trytinct"
Repository = "https://github.com/davidnitty/trytinct"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
